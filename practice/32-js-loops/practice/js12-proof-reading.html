    <h1>Build a Proofreading Tool</h1>

<script>
    function isPalindrome(word) {
        // Convert the word to lowercase so the comparison is not case-sensitive.
        // Example: "Level" becomes "level".
        let thisWord = word.toLowerCase();

        // Take the original word and compare it with its reversed version.
        //
        // slice(0) creates a copy of the string.
        // split("") turns the string into an array of characters.
        // reverse() reverses that array.
        // join("") puts the characters back together into a string.
        //
        // Example:
        // "level" → ["l", "e", "v", "e", "l"]
        // → ["l", "e", "v", "e", "l"]
        // → "level"
        //
        // If they are NOT equal, the word is not a palindrome.
        if (thisWord.slice(0) !== thisWord.split("").reverse().join("")) {

            // Return false because the word is not a palindrome.
            return false;
        }

        // If the words were equal, return true.
        return true;
    }

    function findPalindromeBreaks(words) {
        // Create an empty array.
        // We will store the INDEX of every word that is not a palindrome.
        const nonPalindrome = [];

        // Loop through every word in the array.
        for (let i = 0; i < words.length; i++) {

            // Send the current word to isPalindrome().
            //
            // words[i] = the current word.
            //
            // If isPalindrome() returns false,
            // that means the current word is NOT a palindrome.
            if (isPalindrome(words[i]) === false) {

                // Store the current index in nonPalindrome.
                //
                // Example:
                // ["racecar", "hello", "level"]
                //                    ↑
                //                    i = 1
                //
                // "hello" is not a palindrome,
                // so we store 1.
                nonPalindrome.push(i);
            }
        }

        // After checking ALL the words,
        // return the array containing the indexes of non-palindromes.
        return nonPalindrome;
    }

    // Slice method and 2 loops
    function findRepeatedPhrases(words, phraseLength) {
        // Create an empty array.
        // We will store the starting indexes of repeated phrases.
        const repeatedPhrases = [];

        // If the requested phrase is as long as the entire array
        // or longer, there cannot be a repeated phrase.
        //
        // Example:
        // words.length = 5
        // phraseLength = 5
        //
        // There is only one possible phrase,
        // so there cannot be a second occurrence.
        if (phraseLength >= words.length) {

            // Return the empty array.
            return repeatedPhrases;
        }

        // i represents the STARTING INDEX of the first phrase.
        //
        // Example:
        // ["the", "cat", "sat", "the", "cat"]
        //    ↑
        //    i = 0
        //
        // We stop at words.length - phraseLength
        // because we need enough words remaining to form a complete phrase.
        for (let i = 0; i <= words.length - phraseLength; i++) {

            // Create the first phrase.
            //
            // slice() takes words starting at i
            // and stops before i + phraseLength.
            //
            // If i = 0 and phraseLength = 2:
            // words.slice(0, 2)
            // → ["the", "cat"]
            const firstPhrase = words.slice(i, i + phraseLength);

            // j represents the STARTING INDEX of the second phrase.
            //
            // We start at i + 1 because we don't want to compare
            // a phrase with itself.
            //
            // If i = 0:
            // j starts at 1.
            //
            // If i = 1:
            // j starts at 2.
            for (let j = i + 1; j <= words.length - phraseLength; j++) {

                // Create the second phrase.
                //
                // Example:
                // j = 3
                // phraseLength = 2
                //
                // words.slice(3, 5)
                // → ["the", "cat"]
                const secondPhrase = words.slice(j, j + phraseLength);

                // Convert both phrase arrays into strings
                // and compare them.
                //
                // ["the", "cat"].join(" ")
                // → "the cat"
                //
                // ["the", "cat"].join(" ")
                // → "the cat"
                //
                // If they are equal, the phrases are repeated.
                if (firstPhrase.join(" ") === secondPhrase.join(" ")) {

                    // Store the starting index of the first phrase.
                    repeatedPhrases.push(i);

                    // Store the starting index of the second phrase.
                    repeatedPhrases.push(j);
                }
            }
        }

        // Return all the indexes where repeated phrases were found.
        return repeatedPhrases;
    }

    // 3 loops method
    function findRepeatedPhrases(words, phraseLength) {
        // Create an empty array.
        // We will store the starting indexes of repeated phrases.
        const repeatedPhrases = [];

        // If the phrase is as long as the entire array
        // or longer, there cannot be a repeated phrase.
        if (phraseLength >= words.length) {

            // Return the empty array.
            return repeatedPhrases;
        }

        // i represents the starting index of the FIRST phrase.
        for (let i = 0; i <= words.length - phraseLength; i++) {

            // j represents the starting index of the SECOND phrase.
            //
            // Start at i + 1 so we don't compare a phrase with itself.
            for (let j = i + 1; j <= words.length - phraseLength; j++) {

                // We initially assume that the two phrases are the same.
                //
                // If we find even ONE different word,
                // we will change this to false.
                let isSame = true;

                // k represents the position INSIDE the phrases.
                //
                // If phraseLength = 2:
                //
                // k = 0 → compare first words
                // k = 1 → compare second words
                for (let k = 0; k < phraseLength; k++) {

                    // Compare the words at the same position
                    // inside both phrases.
                    //
                    // i + k = position inside first phrase
                    // j + k = position inside second phrase
                    //
                    // Example:
                    // i = 0
                    // j = 3
                    // k = 0
                    //
                    // words[0 + 0] → "the"
                    // words[3 + 0] → "the"
                    //
                    // Then:
                    //
                    // k = 1
                    //
                    // words[0 + 1] → "cat"
                    // words[3 + 1] → "cat"
                    if (words[i + k] !== words[j + k]) {

                        // The words are different,
                        // so the phrases cannot be the same.
                        isSame = false;

                        // Stop the k loop immediately.
                        // There is no reason to keep comparing
                        // once we know the phrases are different.
                        break;
                    }
                }

                // After the k loop finishes,
                // check whether the phrases were completely identical.
                if (isSame) {

                    // Store the starting index of the first phrase.
                    repeatedPhrases.push(i);

                    // Store the starting index of the second phrase.
                    repeatedPhrases.push(j);
                }
            }
        }

        // Return the indexes of all repeated phrases.
        return repeatedPhrases;
    }

    function analyzeTexts(texts, phraseLength) {
        // Create an empty array.
        // Each text will eventually produce one result object.
        const results = [];

        // Loop through every text in the texts array.
        for (let i = 0; i < texts.length; i++) {

            // Send the current text to findPalindromeBreaks().
            //
            // texts[i] = the current text.
            //
            // The function returns the indexes of words
            // that are not palindromes.
            const palindromeBreaks = findPalindromeBreaks(texts[i]);

            // Send the current text and phraseLength
            // to findRepeatedPhrases().
            //
            // The function returns the indexes
            // where repeated phrases were found.
            const repeatedPhrases = findRepeatedPhrases(
                texts[i],
                phraseLength
            );

            // Create an object containing the results
            // for the current text.
            results.push({

                // Store the repeated phrase indexes.
                repeatedPhrases: repeatedPhrases,

                // Store the non-palindrome indexes.
                palindromeBreaks: palindromeBreaks
            });
        }

        // After checking every text,
        // return the complete results array.
        return results;
    }
