<script>
    function censorWord(word) {
        let wordCensor = word;

        let firstLetter = wordCensor.charAt(0).toUpperCase();
        let lastLetter = wordCensor.slice(-1);
        let censored = "*".repeat(wordCensor.length - 2);

        return firstLetter + censored + lastLetter;
    }

    let word = "javascript";
