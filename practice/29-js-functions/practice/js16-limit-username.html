<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit a Username</title>
</head>

<body>
    <h1>Limit a Username</h1>
</body>

<script>
    function limitUsername(str, num) {
        // Check if the username is longer than the allowed length
        if (str.length > num) {

            // Take only the first 'num' characters
            let username = str.slice(0, num);

            // Add * to the end and return the result
            return username + "*";

        } else {

            // If the username is already short enough, return it unchanged
            return str;
        }
    }

    console.log(limitUsername("javascriptMaster", 10));
</script>

</html>
