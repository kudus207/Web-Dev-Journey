<script>
    function maskEmail(email) {
        let emailAddress = email;

        let atIndex = emailAddress.indexOf("@");

        let username = emailAddress.slice(0, atIndex);

        let domain = emailAddress.slice(atIndex);

        let firstLetter = username.slice(0, 1);

        let lastLetter = username.slice(-1);

        let stars = "*".repeat(username.length - 2);

        return firstLetter + stars + lastLetter + domain;
    }

    let email = "apple.pie@example.com";

    console.log(maskEmail(email));
