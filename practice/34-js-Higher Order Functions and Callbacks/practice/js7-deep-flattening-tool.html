<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Flattening Tool, Completed</title>
</head>

<body>
    <h1>Create a Deep Flattening Tool, Completed</h1>
</body>

<script>
    function steamrollArray(arr) {
        // Define a function named steamrollArray that accepts one argument, arr.
        // arr represents the array we want to flatten, regardless of how deeply
        // its elements are nested inside other arrays.

        const result = [];
        // Create an empty array named result.
        // We will use this array to collect all the final elements.
        // By the time the function finishes, result should contain no nested arrays.
        // Each function call creates its own separate result array.

        for (let i = 0; i < arr.length; i++) {
            // Start a for loop to examine every element in arr.
            // let i = 0 means we start at index 0, the first element.
            // i < arr.length keeps the loop running while there are elements to examine.
            // i++ increases i by 1 after each iteration.
            // arr[i] gives us the element at the current index.

            if (Array.isArray(arr[i])) {
                // Check whether the current element is an array.
                // Array.isArray(arr[i]) returns true if arr[i] is an array.
                // For example, [2, 3] returns true, but 2 and {} return false.
                // If the element is an array, we need to examine its contents too.
                // We cannot simply add it to result because that would preserve nesting.

                const flattened = steamrollArray(arr[i]);
                // Call steamrollArray again, passing the current nested array as an argument.
                // This is called recursion: a function calling itself.
                // The new function call examines the nested array using the same process.
                // If it finds another nested array, it calls itself again.
                // This continues until all the nested elements have been processed.
                // When the recursive call finishes, it returns a flattened array.
                // We store that returned array in the local variable flattened.
                // For example, if arr[i] is [2, [3, 4]], flattened becomes [2, 3, 4].

                result.push(...flattened);
                // Add every element from flattened to the current result array.
                // The spread syntax (...) expands the elements of flattened individually.
                // For example, if result is [1] and flattened is [2, 3],
                // result.push(...flattened) produces [1, 2, 3].
                // Without the spread syntax, result.push(flattened) would produce
                // [1, [2, 3]], leaving a nested array in the result.
                // This line combines the flattened elements with the elements
                // already collected by the current function call.

            } else {
                // This block runs when the current element is NOT an array.
                // Examples include numbers, strings, objects, booleans, and null.
                // These values should remain unchanged because the lab only asks us
                // to unwrap arrays, not remove or modify other types of values.

                result.push(arr[i]);
                // Add the current non-array element directly to result.
                // For example, if arr[i] is 5, the number 5 is added.
                // If arr[i] is {}, that object is added and remains unchanged.
                // push() adds the element to the end of the result array.
            }
            // End of the if...else statement.
            // After processing the current element, the loop moves to the next one.
        }
        // End of the for loop.
        // At this point, every element in arr has been examined.
        // Any nested arrays have been recursively processed, and their elements
        // have been added to result in their original order.

        return result;
        // Return the completed flattened array to whoever called the function.
        // If this was a recursive call, the returned array goes back to the
        // previous function call that was waiting for it.
        // If this was the original call, the returned array is the final answer.
    }

    // TEST 1: Multiple levels of nested arrays containing strings.
    console.log(steamrollArray([[["a"]], [["b"]]]));
    // Expected output: ["a", "b"]
    // The function keeps opening nested arrays until it reaches "a" and "b".
    // Both strings are added to the result without their surrounding arrays.

    // TEST 2: Numbers nested at different levels.
    console.log(steamrollArray([1, [2], [3, [[4]]]]));
    // Expected output: [1, 2, 3, 4]
    // The number 1 is added directly.
    // The array [2] is recursively processed, adding 2.
    // The array [3, [[4]]] is recursively processed, adding 3 and then 4.

    // TEST 3: An empty array inside the original array.
    console.log(steamrollArray([1, [], [3, [[4]]]]));
    // Expected output: [1, 3, 4]
    // The number 1 is added directly.
    // The empty array [] contains no elements, so its recursive call returns [].
    // Spreading this empty result adds nothing to result.
    // The remaining nested arrays are processed, adding 3 and 4.

    // TEST 4: An object mixed with numbers and nested arrays.
    console.log(steamrollArray([1, {}, [3, [[4]]]]));
    // Expected output: [1, {}, 3, 4]
    // The number 1 is added directly.
    // The empty object {} is not an array, so it is preserved unchanged.
    // The remaining nested arrays are processed, adding 3 and 4.

</script>

</html>
