<script>
    let movies = [];

    function addMovieToEnd(arr, movie) {
        arr.push(movie);
        console.log(movie + " added to the end of the watchlist.");
        return arr;
    }

    function addMovieToStart(arr, movie) {
        arr.unshift(movie);
        console.log(movie + " added to the start of the watchlist.");
        return arr;
    }

    function watchLastMovie(arr) {
        let removed = arr.pop();

        if (removed !== undefined) {
            console.log(removed + " watched from the end of the watchlist.");
        } else {
            console.log("No movies to watch.");
        }

        return arr;
    }

    function watchFirstMovie(arr) {
        let removed = arr.shift();

        if (removed !== undefined) {
            console.log(removed + " watched from the start of the watchlist.");
        } else {
            console.log("No movies to watch.");
        }

        return arr;
    }

    function pickRandomMovie(arr) {
        if (arr.length !== 0) {
            let randomMovie = Math.floor(Math.random() * arr.length);
            console.log("Tonight's movie: " + arr[randomMovie]);
        } else {
            console.log("No movies available.");
        }
    }

    function showWatchlist(arr) {
        if (arr.length !== 0) {
            console.log("Watchlist: " + arr.join(", "));
        } else {
            console.log("The watchlist is empty.");
        }
    }

    console.log(addMovieToEnd(movies, "Avatar"));
    console.log(addMovieToEnd(movies, "Inception"));

    console.log(addMovieToStart(movies, "Interstellar"));

    console.log(showWatchlist(movies));

    console.log(pickRandomMovie(movies));

    console.log(watchLastMovie(movies));

    console.log(showWatchlist(movies));
