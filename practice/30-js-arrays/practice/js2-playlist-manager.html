<script>
    let playlist = [];

    function addTracktToEnd(arr, trackName) {
        arr.push(trackName);
        console.log(trackName + " added to the end of the playlist.");
        return arr;
    }

    function addTracktToStart(arr, trackName) {
        arr.unshift(trackName);
        console.log(trackName + " added to the start of the playlist.");
        return arr;
    }

    function removeLastTrack(arr) {
        let removed = arr.pop();
        if (removed !== undefined) {
            console.log(removed + " removed from the end of the playlist.");
        } else {
            console.log("No track to remove.");
        }
        return arr;
    }

    function getShuffleTrack(arr) {
        if (arr.length !== 0) {
            let randomTrack = Math.floor(Math.random() * arr.length);
            console.log("Now playing random track: " + arr[randomTrack]);
        } else {
            console.log("Playlist is empty.");
        }
    }

    function showPlaylist(arr) {
        if (arr.length !== 0) {
            console.log("Current Queue: " + arr.join(" -> "));
        } else {
            console.log("The playlist is empty.");
        }
    }

    console.log(addTracktToEnd(playlist, "Bohemian Rhapsody"));

    console.log(addTracktToStart(playlist, "Stayin' Alive"));

    console.log(showPlaylist(playlist));
