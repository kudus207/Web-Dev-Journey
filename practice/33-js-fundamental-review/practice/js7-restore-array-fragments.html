    function compactFragments(fragments) {
        const newFragments = [];

        for (let i = 0; i < fragments.length; i++) {
            if (fragments[i] !== undefined) {
                newFragments.push(fragments[i]);
            } else {
                console.log(`[COMPACTED] ${fragments[i]} was removed`);
            }
        }

        return newFragments;
    }

    const compactedShuffledFragments = compactFragments(shuffledFragments);

    function sortFragments(fragments) {
        const sortedFragments = [...fragments];

        for (let i = 0; i < sortedFragments.length; i++) {
            for (let j = 0; j < sortedFragments.length - i - 1; j++) {
                if (sortedFragments[j].id > sortedFragments[j + 1].id) {
                    let temporary = sortedFragments[j];
                    sortedFragments[j] = sortedFragments[j + 1];
                    sortedFragments[j + 1] = temporary;
                }
            }
        }
        return sortedFragments;
    }

    const sortedFragments = sortFragments(compactedShuffledFragments);
