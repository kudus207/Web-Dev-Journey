<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator App</title>
</head>

<body>
    <h1>Build a Password Generator App</h1>
</body>

<script>
    function generatePassword(passwordLength) {
        let passwordString = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
        let password = "";

        for (let i = 0; i < passwordLength; i++) {
            let randomIndex = Math.floor(Math.random() * passwordString.length);
            password += passwordString[randomIndex];
        }
        return password;
    }

    const password = generatePassword(4);
    console.log(`Generated password: ${password}`);

</script>

</html>
