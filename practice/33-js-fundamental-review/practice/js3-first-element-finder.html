<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Element Finder</title>
</head>

<body>
    <h1>Build a First Element Finder</h1>
</body>

<script>
    function findElement(arr, testFunction) {
        // Create a loop that goes through every element in the array
        for (let i = 0; i < arr.length; i++) {

            // Pass the current array element to the test function
            // The result will be either true or false
            let func = testFunction(arr[i]);

            // If the test function returned true,
            // return the current element
            if (func) {
                return arr[i];
            }
        }

        // If the loop finishes without finding a passing element,
        // return undefined
        return undefined;
    }

    console.log(findElement([1, 3, 5, 8, 9, 10], function (num) { return num % 2 === 0; }));
    console.log(findElement([1, 3, 5, 9], function (num) { return num % 2 === 0; }));
    console.log(findElement([2, 4, 6, 8], function (num) { return num % 2 === 0; }));
    console.log(findElement(["hello", "world", "javascript"], function (str) { return str.length > 5; }));

</script>

</html>
