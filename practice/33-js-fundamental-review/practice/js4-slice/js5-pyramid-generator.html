<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramid Generator</title>
</head>

<body>
    <h1>Build a Pyramid Generator</h1>
</body>

<script>
    // Define the function taking character symbol, row count, and inverted flag
    function pyramid(char, count, inverted) {
        // Initialize an empty array to hold each formatted row string
        const rows = [];

        // Loop through each row index from 0 up to (count - 1)
        for (let i = 0; i < count; i++) {
            // Generate leading spaces needed to center-align the current row
            const spaces = " ".repeat(count - i - 1);

            // Generate odd number of pattern characters for the current row (1, 3, 5...)
            const pattern = char.repeat(2 * i + 1);

            // Combine spaces and characters into one string and add it to our array
            rows.push(spaces + pattern);
        }

        // Check if the upside-down vertex flag is set to true
        if (inverted) {
            // Flip the array so the widest row comes first and the narrowest comes last
            rows.reverse();
        }

        // Join all rows with newlines, adding a leading and trailing newline character
        return "\n" + rows.join("\n") + "\n";
    }

    console.log(pyramid("o", 4, false)) //  "\n   o\n  ooo\n ooooo\nooooooo\n".
    console.log(pyramid("p", 5, true)) //  "\nppppppppp\n ppppppp\n  ppppp\n   ppp\n    p\n"
</script>

</html>
