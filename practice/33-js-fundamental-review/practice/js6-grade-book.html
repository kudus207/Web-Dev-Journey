<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradebook App</title>
</head>

<body>
    <h1>Build a Gradebook App</h1>
</body>

<script>
    function getAverage(scores) {
        let averageScore;
        let sumOfScores = 0;

        for (let i = 0; i < scores.length; i++) {
            sumOfScores += scores[i];
        }
        const average = sumOfScores / scores.length;
        averageScore = average;

        return averageScore;
    }

    function getGrade(studentScore) {
        let grade = "";

        if (studentScore === 100) {
            grade = "A+";
        } else if (studentScore >= 90 && studentScore <= 99) {
            grade = "A";
        } else if (studentScore >= 80 && studentScore <= 89) {
            grade = "B";
        } else if (studentScore >= 70 && studentScore <= 79) {
            grade = "C";
        } else if (studentScore >= 60 && studentScore <= 69) {
            grade = "D";
        } else if (studentScore <= 59) {
            grade = "F";
        }

        return grade;
    }

    function hasPassingGrade(score) {
        const passingGrade = getGrade(score);

        if (passingGrade !== "F") {
            return true;
        }

        return false;
    }

    function studentMsg(scores, studentScore) {
        const averageScore = getAverage(scores);
        const studentGrade = getGrade(studentScore);

        if (studentGrade !== "F") {
            return `Class average: ${averageScore}. Your grade: ${studentGrade}. You passed the course.`;
        }

        return `Class average: ${averageScore}. Your grade: ${studentGrade}. You failed the course.`;
    }

    console.log(getAverage([92, 88, 12, 77, 57, 100, 67, 38, 97, 89]));
    console.log(getAverage([45, 87, 98, 100, 86, 94, 67, 88, 94, 95]));
    console.log(getAverage([38, 99, 87, 100, 100, 100, 100, 100, 100, 100]));
    console.log(getAverage([10, 20, 30, 40, 55, 65, 75, 83]));
    console.log(getAverage([10, 20, 30, 40, 50, 60, 70, 97]));
    console.log(getGrade(100));
    console.log(getGrade(90));
    console.log(getGrade(83));
    console.log(getGrade(74));
    console.log(getGrade(67));
    console.log(getGrade(31));
    console.log(hasPassingGrade(100));
    console.log(hasPassingGrade(59));
    console.log(studentMsg([92, 88, 12, 77, 57, 100, 67, 38, 97, 89], 37));
    console.log(studentMsg([56, 23, 89, 42, 75, 11, 68, 34, 91, 19], 100));
    console.log(studentMsg([12, 22, 32, 42, 52, 62, 72, 92], 85));
    console.log(studentMsg([15, 25, 35, 45, 55, 60, 70, 60], 75));
</script>

</html>
