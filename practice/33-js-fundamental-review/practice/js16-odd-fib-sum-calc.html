<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Fibonacci Sum Calculator</title>
</head>

<body>
    <h1>Build an Odd Fibonacci Sum Calculator</h1> 
</body>

<script>
    function sumFibs(num) {
        // Create a variable to store the previous Fibonacci number.
        // We start with 0 because the Fibonacci sequence starts with 0.
        let prev = 0;

        // Create a variable to store the current Fibonacci number.
        // We start with 1 because the Fibonacci sequence starts with 0, 1.
        let curr = 1;

        // Create a variable to store the total of the odd Fibonacci numbers.
        // We start the total at 0 because we haven't added anything yet.
        let sum = 0;

        // Keep running the loop as long as the current Fibonacci number
        // is less than or equal to the number given to the function.
        while (curr <= num) {

            // Check whether the current Fibonacci number is odd.
            // % gives us the remainder after division by 2.
            // If the remainder is NOT 0, the number is odd.
            if (curr % 2 !== 0) {

                // Add the current odd Fibonacci number to our total.
                // This is the same as: sum = sum + curr;
                sum += curr;
            }

            // Calculate the next Fibonacci number.
            // A Fibonacci number is created by adding the previous
            // Fibonacci number and the current Fibonacci number.
            let next = curr + prev;

            // Move the current Fibonacci number into the previous position.
            // This prepares the variables for the next loop.
            prev = curr;

            // Move the newly calculated Fibonacci number into the current position.
            // Now curr represents the next Fibonacci number.
            curr = next;
        }

        // Return the final sum after all the required Fibonacci numbers
        // have been checked.
        return sum;
    }


    // Call the function with 4.
    // Fibonacci numbers up to 4 are: 0, 1, 1, 2, 3.
    // Odd Fibonacci numbers are: 1, 1, 3.
    // 1 + 1 + 3 = 5.
    console.log(sumFibs(4));


    // Call the function with 4,000,000.
    // The function generates Fibonacci numbers up to 4,000,000,
    // adds only the odd ones, and returns their total.
    console.log(sumFibs(4000000));


    // Call the function with 1,000.
    // The function generates Fibonacci numbers up to 1,000,
    // adds only the odd ones, and returns their total.
    console.log(sumFibs(1000));


    // Call the function with 75,024.
    // Again, only odd Fibonacci numbers less than or equal to
    // 75,024 are added.
    console.log(sumFibs(75024));


    // Call the function with 75,025.
    // Only odd Fibonacci numbers less than or equal to
    // 75,025 are added.
    console.log(sumFibs(75025));
</script>

</html>
