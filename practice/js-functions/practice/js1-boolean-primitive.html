<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean Check Function</title>
</head>

<body>
    <h1>Boolean Primitive Check Function</h1>
</body>

<script>
    function booWho(value) {
        if (value === Boolean(value)) {
            return true;
        } else {
            return false;
        }
    }

    console.log(booWho(false));
</script>

</html>
