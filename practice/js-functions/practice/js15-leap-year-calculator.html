<body>
    <h1>Build a Leap Year Calculator</h1>
</body>

<script>
    let year = 2024;

    function isLeapYear(leapYear) {

        if (
            (leapYear % 4 === 0 && leapYear % 100 !== 0) ||
            (leapYear % 400 === 0)
        ) {
            return `${leapYear} is a leap year.`;
        } else {
            return `${leapYear} is not a leap year.`;
        }

    }

    let result = isLeapYear(year);

    console.log(result);
