<script>
    function maskCardNumber(cardNumber) {
        let cardNumMask = cardNumber;

        let firstTwoNum = cardNumMask.slice(0, 2);
        let lastTwoNum = cardNumMask.slice(-2);
        let masker = "*".repeat(cardNumMask.length - 4);

        return firstTwoNum + masker + lastTwoNum;
    }

    let cardNumber = "1229887989873923";

    console.log(maskCardNumber(cardNumber));
