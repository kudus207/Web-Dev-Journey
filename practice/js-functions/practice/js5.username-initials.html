<script>
    function getInitials(fullName) {
        let initials = fullName;

        let firstCapitalized = initials.charAt(0).toUpperCase();
        let space = initials.indexOf(" ");
        let secondCapitalized = initials.charAt(space + 1).toUpperCase();
        let joining = ".";

        return firstCapitalized + joining + secondCapitalized;
    }

    let fullName = "olaniyi kudus";

    console.log(getInitials(fullName));
