<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Collection</title>
</head>

<body>
    <h1>Build a Record Collection</h1>
</body>

<script>
    const recordCollection = {
        2548: {
            albumTitle: 'Slippery When Wet',
            artist: 'Bon Jovi',
            tracks: ['Let It Rock', 'You Give Love a Bad Name']
        },
        2468: {
            albumTitle: '1999',
            artist: 'Prince',
            tracks: ['1999', 'Little Red Corvette']
        },
        1245: {
            artist: 'Robert Palmer',
            tracks: []
        },
        5439: {
            albumTitle: 'ABBA Gold'
        }
    };

    function updateRecords(records, id, prop, value) {

        // If value is an empty string, delete the property
        if (value === "") {
            delete records[id][prop];
        }

        // If the property is not "tracks" and value is not empty
        else if (prop !== "tracks") {
            records[id][prop] = value;
        }

        // If the property is "tracks"
        else {

            // If tracks doesn't exist, create it
            if (!records[id].hasOwnProperty("tracks")) {
                records[id].tracks = [];
            }

            // Add the new track
            records[id].tracks.push(value);
        }

        // Always return the entire records object
        return records;
    }
</script>

</html>
