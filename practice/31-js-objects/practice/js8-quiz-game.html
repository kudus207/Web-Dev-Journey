<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
</head>

<body>
    <h1>Build a Quiz Game</h1>
</body>

<script>
    const questions = [
        {
            category: "Name",
            question: "What is your name?",
            choices: ["Kudus", "Sodiq", "Habib"],
            answer: "Kudus"
        },
        {
            category: "Age",
            question: "What is your current age?",
            choices: ["24", "25", "26"],
            answer: "25"
        },
        {
            category: "Country of origin",
            question: "Which country are you from?",
            choices: ["England", "Nigeria", "China"],
            answer: "Nigeria"
        },
        {
            category: "Current City",
            question: "Which city do you live?",
            choices: ["Abuja", "Lagos", "Accra"],
            answer: "Abuja"
        },
        {
            category: "Profession",
            question: "What do you do for a living?",
            choices: ["Banker", "Lawyer", "Web developer"],
            answer: "Web developer"
        }
    ];

    function getRandomQuestion(questions) {
        const randomIndex = Math.floor(Math.random() * questions.length);

        return questions[randomIndex];
    }

    function getRandomComputerChoice(choices) {
        const randomIndex = Math.floor(Math.random() * choices.length);

        return choices[randomIndex];
    }

    function getResults(question, computerChoice) {
        if (question.answer === computerChoice) {
            return "The computer's choice is correct!";
        } else {
            return `The computer's choice is wrong. The correct answer is: ${question.answer}`;
        }
    }

    const randomQuestion = getRandomQuestion(questions);
    const randomComputerChoice = getRandomComputerChoice(randomQuestion.choices);
    const results = getResults(randomQuestion, randomComputerChoice);

    console.log(randomQuestion);
    console.log(randomComputerChoice);
    console.log(results);


</script>

</html>
