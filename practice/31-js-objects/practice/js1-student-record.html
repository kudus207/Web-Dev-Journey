<script>
    const studentRecord = {
        studentId: 101,
        name: "Olaniyi Kudus",
        age: 25,
        grade: 92,
        graduated: false
    }

    function normalizeGrade(student) {
        const studentRecordCopy = { ...student }

        if (studentRecordCopy.grade > 100) {
            studentRecordCopy.grade = 100;
        } else if (studentRecordCopy.grade < 0) {
            studentRecordCopy.grade = 0;
        }
        return studentRecordCopy;
    }

    function validateStudent(student) {
        const errors = {};

        if (student.studentId === undefined) {
            errors.studentId = "Missing";
        } else if (typeof student.studentId !== "number" || Number.isNaN(student.studentId) || !Number.isInteger(student.studentId) || student.studentId <= 0) {
            errors.studentId = "Invalid";
        }

        if (student.name === undefined) {
            errors.name = "Missing";
        } else if (typeof student.name !== "string" || student.name.trim().length === 0) {
            errors.name = "Invalid";
        }

        if (student.age === undefined) {
            errors.age = "Missing";
        } else if (typeof student.age !== "number" || Number.isNaN(student.age) || !Number.isInteger(student.age) || student.age <= 0) {
            errors.age = "Invalid";
        }

        if (student.grade === undefined) {
            errors.grade = "Missing";
        } else if (typeof student.grade !== "number" || Number.isNaN(student.grade)) {
            errors.grade = "Invalid";
        }

        if (student.graduated === undefined) {
            errors.graduated = "Missing";
        } else if (typeof student.graduated !== "boolean") {
            errors.graduated = "Invalid";
        }

        return errors;
    }

    function processStudent(student) {
        const validationResult = validateStudent(student);

        if (Object.keys(validationResult).length === 0) {
            const normalizedStudent = normalizeGrade(student);

            console.log(`Validate success: ${student.studentId}`);
            console.log(`Total grade: ${normalizedStudent.grade}`);
        } else {
            console.log(`Validate error: ${student.studentId}`);
            console.log(validationResult);
        }
    }
