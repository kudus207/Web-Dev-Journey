    const cargoManifest = {
        payloadId: 101,
        launchPad: "Cape Canaveral, FL, USA",
        velocity: 2500,
        speedUnit: "mph",
        pressurized: true
    }

    function normalizeVelocity(manifest) {
        const manifestCopy = { ...manifest };

        if (manifestCopy.speedUnit === "mph") {
            manifestCopy.velocity *= 0.44;
            manifestCopy.speedUnit = "mps"
        }

        return manifestCopy;
    }

    function validateSpaceManifest(manifest) {
        const errors = {};

        if (manifest.payloadId === undefined) {
            errors.payloadId = "Missing";
        } else if (typeof manifest.payloadId !== "number" || Number.isNaN(manifest.payloadId) || !Number.isInteger(manifest.payloadId) || manifest.payloadId <= 0) {
            errors.payloadId = "Invalid";
        }

        if (manifest.launchPad === undefined) {
            errors.launchPad = "Missing";
        } else if (typeof manifest.launchPad !== "string" || manifest.launchPad.trim().length === 0) {
            errors.launchPad = "Invalid";
        }

        if (manifest.velocity === undefined) {
            errors.velocity = "Missing";
        } else if (typeof manifest.velocity !== "number" || Number.isNaN(manifest.velocity) || manifest.velocity <= 0) {
            errors.velocity = "Invalid";
        }

        if (manifest.speedUnit === undefined) {
            errors.speedUnit = "Missing";
        } else if (manifest.speedUnit !== "mps" && manifest.speedUnit !== "mph") {
            errors.speedUnit = "Invalid";
        }

        if (manifest.pressurized === undefined) {
            errors.pressurized = "Missing";
        } else if (typeof manifest.pressurized !== "boolean") {
            errors.pressurized = "Invalid";
        }

        return errors;
    }

    function processSpaceManifest(manifest) {
        const validationErrors = validateSpaceManifest(manifest);

        if (Object.keys(validationErrors).length === 0) {
            const normalVelocity = normalizeVelocity(manifest);

            console.log(`Validation success: ${manifest.payloadId}`);
            console.log(`Total velocity ${normalVelocity.velocity} mps`);
        } else {
            console.log(`Validation error: ${manifest.payloadId}`);
            console.log(validationErrors);
        }
    }
