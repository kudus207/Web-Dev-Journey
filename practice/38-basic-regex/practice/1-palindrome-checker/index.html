<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1> Is it a Palindrome?</h1>
    </header>
    <main>
        <div class="container">
            <div class="check-container">
                <p class="check-msg">Enter in text to check for palindrome:</p>
                <input id="text-input" type="text" value="" name="message">
                <button id="check-btn" type="button">Check</button>
                <p id="result"></p>
            </div>
            <div class="msg-container">
                <p class="msg">💡 A palindrome is a word or sentence that's spelled the same way both forward and
                    backward, ignoring punctuation, case, and spacing.</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
